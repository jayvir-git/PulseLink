rve"><tspan x="0" y="-16.05">Transporting</tspan><tspan x="0" y="5.95">Destination hospital</tspan><tspan x="0" y="27.95">required</tspan></text></g><g class="pele-node pele-shape-rect" data-id="D" transform="translate(269.52,436)"><rect x="-99.74" y="-34" width="199.49" height="68" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-5.05">Arrived</tspan><tspan x="0" y="16.95">EMS handoff pending</tspan></text></g><g class="pele-node pele-shape-rect" data-id="E" transform="translate(144.26,552)"><rect x="-99.24" y="-34" width="198.49" height="68" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-5.05">Handed off</tspan><tspan x="0" y="16.95">Clinical editing closes</tspan></text></g><g class="pele-node pele-shape-rect" data-id="F" transform="translate(491.25,436)"><rect x="-81.99" y="-34" width="163.98" height="68" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-5.05">Hospital queue ·</tspan><tspan x="0" y="16.95">Incoming</tspan></text></g><g class="pele-node pele-shape-rect" data-id="G" transform="translate(394.77,552)"><rect x="-111.27" y="-25" width="222.54" height="50" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.95" text-anchor="middle">Hospital queue · Arrived</text></g><g class="pele-node pele-shape-rect" data-id="H" transform="translate(144.26,668)"><rect x="-116.26" y="-34" width="232.52" height="68" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-5.05">Awaiting acknowledgment</tspan><tspan x="0" y="16.95">Review the handoff report</tspan></text></g><g class="pele-node pele-shape-rect" data-id="I" transform="translate(144.26,784)"><rect x="-111.