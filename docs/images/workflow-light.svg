<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 602 846" width="602" height="846" style="--pele-bg:#f4f7f5;--pele-fg:#13201c;--pele-muted:#4d635b;--pele-line:#0f6a56;--pele-surface:#ffffff;--pele-surface-alt:#e3eee8;--pele-border:#73978a;--pele-accent:#0f6a56;background:#f4f7f5;max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,monospace);font:17px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,Arial, sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" aria-labelledby="pulselink-workflow-title" aria-describedby="pulselink-workflow-desc"><title id="pulselink-workflow-title">PulseLink — from field care to hospital receipt</title><desc id="pulselink-workflow-desc">EMS creates a draft, records care and advances transport. The destination hospital sees incoming and arrived reports. EMS completes handoff, then hospital staff acknowledges report receipt separately from clinical responsibility.</desc><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_A_B_0"><path d="M380.38,78L380.38,119"/><path class="pele-marker" d="M380.38,126L377.02,118L383.74,118Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_B_C_0"><path d="M380.38,216L380.38,257"/><path class="pele-marker" d="M380.38,264L377.02,256L383.74,256Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_C_D_0"><path d="M340.21,354C340.21,371.5 269.52,371.5 269.52,389L269.52,395"/><path class="pele-marker" d="M269.52,402L266.16,394L272.88,394Z" fill="var(--_l)" stroke="none"/></g><g class="pele-